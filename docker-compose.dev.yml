version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres-dev:
    image: postgres:14-alpine
    container_name: erp-postgres-dev
    environment:
      POSTGRES_DB: erp_remotenyx_dev
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - erp-dev-network
    restart: unless-stopped

  # Backend API for Development
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    container_name: erp-backend-dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: erp_remotenyx_dev
      DB_USER: erp_admin
      DB_PASSWORD: admin123
      JWT_SECRET: dev-jwt-secret-key
      PORT: 5000
    volumes:
      - ./server:/app:cached
      - ./uploads:/app/uploads
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - postgres-dev
    networks:
      - erp-dev-network
    restart: unless-stopped
    command: npm run dev

  # Frontend for Development
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: base
    container_name: erp-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - ./client:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
    networks:
      - erp-dev-network
    restart: unless-stopped
    command: npm run dev

  # pgAdmin for database management
  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@remotenyx.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres-dev
    networks:
      - erp-dev-network
    restart: unless-stopped

  # Redis for development (optional)
  redis-dev:
    image: redis:7-alpine
    container_name: erp-redis-dev
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp-dev-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Mailhog for email testing in development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: erp-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - erp-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  erp-dev-network:
    driver: bridge
    name: erp-dev-network